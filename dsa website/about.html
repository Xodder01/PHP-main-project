<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Java Programs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.5)), url("image2.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.2), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(235, 51, 73, 0.2), transparent 50%);
            animation: moveGradient 15s ease infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes moveGradient {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .container {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .about-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Shine Effect */
        .about-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .college-image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
            animation: floatImage 3s ease-in-out infinite;
        }

        @keyframes floatImage {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .college-image {
            width: 300px;
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border: 5px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .college-image:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 20px 70px rgba(102, 126, 234, 0.6);
            border-color: rgba(102, 126, 234, 0.8);
        }

        /* Glow Ring Around Image */
        .college-image-wrapper::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110%;
            height: 110%;
            transform: translate(-50%, -50%);
            border-radius: 20px;
            background: linear-gradient(45deg, #f45c43, #eb3349, #667eea, #764ba2);
            background-size: 300% 300%;
            animation: rotateGradient 4s ease infinite;
            z-index: -1;
            opacity: 0.6;
            filter: blur(15px);
        }

        @keyframes rotateGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .info-section {
            margin-top: 30px;
        }

        .info-item {
            color: #fff;
            margin: 25px 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0;
            animation: slideIn 0.6s ease-out forwards;
            position: relative;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .info-item:nth-child(1) {
            animation-delay: 0.3s;
            border-left-color: #f45c43;
        }

        .info-item:nth-child(2) {
            animation-delay: 0.5s;
            border-left-color: #667eea;
        }

        .info-item:nth-child(3) {
            animation-delay: 0.7s;
            border-left-color: #eb3349;
        }

        .info-item:nth-child(4) {
            animation-delay: 0.9s;
            border-left-color: #764ba2;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }

        .info-label {
            color: #ffd700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .info-value {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Decorative Elements */
        .decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            background: #f45c43;
            animation-delay: 0s;
        }

        .decoration-2 {
            bottom: 10%;
            right: 5%;
            background: #667eea;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .about-card {
                padding: 30px 20px;
            }

            .college-image {
                width: 220px;
            }

            .info-item {
                font-size: 18px;
                padding: 12px 20px;
            }

            .info-value {
                font-size: 22px;
            }

            .info-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="container">
        <div class="about-card">
            <div class="college-image-wrapper">
                <img src="college.jpg" alt="College Logo" class="college-image">
            </div>
            
            <div class="info-section">
                <div class="info-item">
                    <span class="info-label">Student Name</span>
                    <div class="info-value">Lakhinder Singh</div>
                </div>
                
                <div class="info-item">
                    <span class="info-label">Course</span>
                    <div class="info-value">BCA III</div>
                </div>
                
                <div class="info-item">
                    <span class="info-label">Roll Number</span>
                    <div class="info-value">4066/23</div>
                </div>
                
                <div class="info-item">
                    <span class="info-label">Submitted To</span>
                    <div class="info-value">Mr. Gaurav Sir</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
